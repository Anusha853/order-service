spring:
  application:
    name: order-service
  main:
    lazy-initialization: true
  cloud:
    openfeign:
      client:
        config:
          inventory-service:
            connect-timeout: 2000
            read-timeout: 30000

server:
  port: 8080

logging:
  level:
    com.q1.order.client: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  bulkhead:
    instances:
      inventoryServiceBulkhead:
        maxConcurrentCalls: 2
        maxWaitDuration: 10s
  thread-pool-bulkhead:
    instances:
      inventoryServiceBulkhead:
        core-thread-pool-size: 1
        max-thread-pool-size: 3
        queue-capacity: 1